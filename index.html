<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiggy</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
        rel="stylesheet"
    />
</head>
<style>
    @font-face {
        font-family: gilroy;
        src: url(https://media-assets.swiggy.com/dls-web-assets/dls/fonts/Gilroy-ExtraBold.woff2);
    }
</style>
<body class="h-screen">
    <main class="h-[85%] w-screen bg-[#FF5201]">
        <nav class = "flex w-full justify-between items-center px-[100px] py-5">
            <img 
            class="h-fit"
            width="80" 
            src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/portal/static-assets/images/swiggy_logo_white.png" alt="">

            <div class="flex gap-5 text-[10px] text-white items-center">
                <p class="font-[gilroy]">Swiggy Corporate</p>
                <p>Partner with us</p>
                <button class="px-3 py-2 border border-white rounded-lg cursor-pointer">Get the app<i class="ri-arrow-right-up-long-fill"></i></button>
                <button class="px-3 py-2 border-0 bg-black text-white rounded-lg cursor-pointer" >Sign in</button>
            </div>
        </nav>
    </main>
    
</body>
</html>
